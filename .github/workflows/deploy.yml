name: Deploy site to AWS

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  id-token: write # lets GitHub request a short-lived AWS sign-in token
  contents: read

concurrency:
  group: deploy-production # never run two deploys at once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04 # pinned so the Ubuntu 26 switch on Oct 19, 2026 doesn't change anything
    env:
      SITE_DIR: site
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Check out the site files
        uses: actions/checkout@v6

      # ---- TEMPORARY DEBUG STEP: delete this whole step once deploys work ----
      # Prints what GitHub sends to AWS (not the token itself), so you can
      # compare "sub" with the trust policy character for character.
      - name: Debug - show OIDC claims (remove after fixing)
        run: |
          echo "Role ARN variable: [${{ vars.AWS_DEPLOY_ROLE_ARN }}]"
          echo "Region variable:   [${{ vars.AWS_REGION }}]"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="$P="; done
          echo "$P" | base64 -d | jq '{sub, aud, iss, repository, ref}'
      # ---- END TEMPORARY DEBUG STEP ----
      - name: Sign in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Images, CSS, JS and PDFs: browsers may keep them for 1 day.
      # --delete removes files from S3 that you deleted from the repo.
      - name: Upload images, styles, scripts and downloads
        run: |
          aws s3 sync "$SITE_DIR" "s3://$S3_BUCKET" \
            --delete \
            --exclude "*.html" \
            --exclude ".DS_Store" \
            --exclude "*/.DS_Store" \
            --cache-control "public, max-age=86400"

      # HTML pages: browsers always check for a newer version,
      # so visitors see your updates right away.
      - name: Upload HTML pages
        run: |
          aws s3 sync "$SITE_DIR" "s3://$S3_BUCKET" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache"

      # Tells CloudFront to fetch the fresh files. "/*" counts as one path.
      - name: Clear the CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Summary
        run: echo "Deployed $SITE_DIR to s3://$S3_BUCKET" >> "$GITHUB_STEP_SUMMARY"
